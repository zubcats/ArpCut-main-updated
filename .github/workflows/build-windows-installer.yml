# Windows installer only — primary shipping path (Windows-only product).
#
# Push to `main` (stable production) → rolling tag `stable-latest`, artifact ZubCut-Setup.exe.
# Push to `experimental` → tester build: tag `experimental-latest`, ZubCut-Setup-experimental.exe.
# Manual `workflow_dispatch` is still available when you want a build without a push.
#
# Control Panel-only commits (paths-ignore below) do not start this workflow.
# Shared ZubCut modules (constants, updater_core, …) are NOT ignored — they must
# still build customer installers.

name: Build Windows installer only

on:
  push:
    branches:
      - main
      - experimental
    paths-ignore:
      - 'build_control_panel.py'
      - 'src/zubcut_control_panel.py'
      - 'src/gui/control_panel.py'
      - 'src/gui/crash_reports_panel.py'
      - 'src/tools/license_admin.py'
      - 'src/tools/license_cloud_sync.py'
      - 'src/tools/control_panel_crashes.py'
      - 'packaging/pyinstaller-hooks/rthook_qt_control_panel.py'
      - 'installer/ZubCut-Control-Panel.iss'
      - 'installer/Build-Control-Panel-Installer.bat'
      - 'tests/test_control_panel.py'
      - 'tools/crash_reports_admin.py'
      - '.github/workflows/build-control-panel-windows.yml'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Build channel for artifacts/updater constants'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - main
          - experimental

permissions:
  contents: write

# One run per branch; a new push cancels an in-progress build on that branch only.
concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Verify tracked files exist on disk
        run: python tools/verify_tracked_files_exist.py

      # Build from tracked sources (no silent ci-blessed overwrite). Drift is gated in Unit tests.
      - name: Apply update-channel constants for this branch
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_CHANNEL: ${{ github.event.inputs.release_channel || '' }}
          UPDATE_URL_MAIN: ${{ vars.UPDATE_DOWNLOAD_URL_MAIN }}
          UPDATE_URL_EXPERIMENTAL: ${{ vars.UPDATE_DOWNLOAD_URL_EXPERIMENTAL }}
          # Current key: LICENSE_PUBLIC_KEY_B64. Previous key stays in PAID_LICENSE_PUBLIC_KEY_B64
          # so existing accounts keep working on new builds without a forced update.
          LICENSE_PUBLIC_KEY_B64: ${{ secrets.LICENSE_PUBLIC_KEY_B64 || secrets.PAID_LICENSE_PUBLIC_KEY_B64 }}
          LICENSE_PUBLIC_KEY_B64_PREV: ${{ secrets.LICENSE_PUBLIC_KEY_B64_PREV || secrets.PAID_LICENSE_PUBLIC_KEY_B64 }}
          LICENSE_SIGNIN_URL: ${{ secrets.LICENSE_SIGNIN_URL }}
          CRASH_INGEST_TOKEN: ${{ secrets.CRASH_INGEST_TOKEN }}
        run: python tools/ci_apply_build_constants.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib pillow

      - name: Verify build script syntax
        run: python -m py_compile build.py

      - name: Refresh APP_BUILD_TIME_ISO before PyInstaller
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from datetime import datetime, timezone
          import re
          p = Path("src/constants.py")
          text = p.read_text(encoding="utf-8")
          build_iso = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          commit = os.environ.get("GITHUB_SHA", "").strip()
          text = re.sub(
              r"^APP_BUILD_TIME_ISO\s*=.*$",
              f"APP_BUILD_TIME_ISO = {build_iso!r}",
              text,
              flags=re.M,
          )
          text = re.sub(
              r"^APP_BUILD_COMMIT\s*=.*$",
              f"APP_BUILD_COMMIT = {commit!r}",
              text,
              flags=re.M,
          )
          p.write_text(text, encoding="utf-8")
          print("Refreshed APP_BUILD_TIME_ISO to", build_iso, "commit", commit[:12])
          PY

      - name: Build Windows EXE (PyInstaller via build.py)
        run: python build.py

      - name: Verify onedir has Python runtime (_internal/python311.dll)
        run: python tools/verify_onedir_payload.py --dist-dir ZubCut

      - name: Verify license crypto in frozen build
        run: python tools/verify_frozen_nacl.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Bundle WinDivert for Clumsy (WinDivert 2.x x64)
        shell: pwsh
        run: |
          & "${{ github.workspace }}/installer/fetch_windivert.ps1"
          & "${{ github.workspace }}/tools/verify_windivert_bundle.ps1"
          & "${{ github.workspace }}/tools/stage_windivert_dist.ps1"

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after Inno install" }
          & $iscc "installer\ZubCut.iss"

      - name: Create channel installer alias
        shell: pwsh
        env:
          REQUESTED_CHANNEL: ${{ github.event.inputs.release_channel || '' }}
        run: |
          $requested = "$env:REQUESTED_CHANNEL".ToLower().Trim()
          if ($requested -eq "main" -or $requested -eq "stable" -or $requested -eq "experimental") {
            if ($requested -eq "experimental") { $channel = "experimental" } else { $channel = "main" }
          } elseif ("${{ github.ref_name }}" -eq "main" -or "${{ github.ref_type }}" -eq "tag") {
            $channel = "main"
          } else {
            $channel = "experimental"
          }
          $latest = Get-ChildItem -Path "output" -Filter "ZubCut-Setup-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $latest) { throw "Installer not found in output/" }
          $aliasName = if ($channel -eq "main") { "ZubCut-Setup.exe" } else { "ZubCut-Setup-experimental.exe" }
          Copy-Item $latest.FullName ("output/" + $aliasName) -Force
          python tools/write_build_info_manifest.py --channel $channel

      - name: Upload installer EXE
        if: ${{ github.event.inputs.release_channel == 'main' || github.event.inputs.release_channel == 'stable' || (github.event.inputs.release_channel != 'experimental' && (github.ref_name == 'main' || github.ref_type == 'tag')) }}
        uses: actions/upload-artifact@v6
        with:
          name: ZubCut-Windows-Installer
          path: |
            output/ZubCut-Setup.exe
            output/build-info.json

      - name: Upload installer EXE (Experimental)
        if: ${{ github.event.inputs.release_channel == 'experimental' || (github.event.inputs.release_channel != 'main' && github.event.inputs.release_channel != 'stable' && github.ref_name != 'main' && github.ref_type != 'tag') }}
        uses: actions/upload-artifact@v6
        with:
          name: ZubCut-Windows-Installer-Experimental
          path: |
            output/ZubCut-Setup-experimental.exe
            output/build-info.json

  # Separate from PyInstaller so a GitHub Releases API blip can be retried
  # without rebuilding the installer. gh CLI retries live in
  # tools/ci_publish_github_release.py.
  publish-stable:
    needs: build-windows
    if: ${{ github.event.inputs.release_channel == 'main' || github.event.inputs.release_channel == 'stable' || (github.event.inputs.release_channel != 'experimental' && github.ref_name == 'main') }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download installer artifact
        uses: actions/download-artifact@v6
        with:
          name: ZubCut-Windows-Installer
          path: output

      - name: Publish rolling stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >
          python tools/ci_publish_github_release.py
          --tag stable-latest
          --title "ZubCut"
          --target ${{ github.sha }}
          --file output/ZubCut-Setup.exe
          --file output/build-info.json

  publish-experimental:
    needs: build-windows
    if: ${{ github.event.inputs.release_channel == 'experimental' || (github.event.inputs.release_channel != 'main' && github.event.inputs.release_channel != 'stable' && github.ref_name == 'experimental') }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download installer artifact
        uses: actions/download-artifact@v6
        with:
          name: ZubCut-Windows-Installer-Experimental
          path: output

      - name: Publish rolling experimental release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >
          python tools/ci_publish_github_release.py
          --tag experimental-latest
          --title "ZubCut (experimental)"
          --target ${{ github.sha }}
          --prerelease
          --file output/ZubCut-Setup-experimental.exe
          --file output/build-info.json

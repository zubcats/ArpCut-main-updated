# Unit tests — once per main/experimental push (Windows product).
# Cursor feature branches and PRs do not trigger this; use workflow_dispatch if needed.
name: Unit tests

on:
  push:
    branches:
      - main
      - experimental
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Drift check (ci-blessed mirrors)
        shell: bash
        run: |
          set -e
          if ! diff -q build.py .github/ci-blessed/build.py; then
            echo "::error::build.py drifted from .github/ci-blessed/build.py — update the mirror."
            exit 1
          fi
          if ! diff -q src/constants.py .github/ci-blessed/constants.py; then
            echo "::warning::src/constants.py differs from ci-blessed (CI may overwrite on installer builds)."
          fi

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
          ZUBCUT_SKIP_ELEVATE: '1'
        run: python -m unittest discover -s tests -p "test_*.py" -v

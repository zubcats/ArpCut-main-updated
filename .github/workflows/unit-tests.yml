# Unit tests for experimental / PR validation (no Windows installer build).
name: Unit tests

on:
  push:
    branches:
      - experimental
      - 'cursor/**'
  pull_request:
    branches:
      - experimental
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Headless Qt for stylesheet / widget smoke tests
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-x11-0 libxcb-cursor0 libegl1 libgl1 || true

      - name: Drift check (ci-blessed mirrors)
        run: |
          set -e
          if ! diff -q build.py .github/ci-blessed/build.py; then
            echo "::error::build.py drifted from .github/ci-blessed/build.py — update the mirror."
            exit 1
          fi
          if ! diff -q src/constants.py .github/ci-blessed/constants.py; then
            echo "::warning::src/constants.py differs from ci-blessed (CI may overwrite on installer builds)."
          fi

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
          ZUBCUT_SKIP_ELEVATE: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

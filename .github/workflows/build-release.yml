# Builds binaries in the cloud — no Python or Inno Setup on your PC.
#
# Triggers:
#   - Tag `v*` → Windows + macOS + Linux, then publishes a GitHub Release.
#   - `workflow_dispatch` → manual full matrix (use for macOS/Linux when needed).
#
# Branch pushes (`main` / `experimental`) only run "Build Windows installer only"
# (one workflow, cancel-in-progress per branch). That avoids two Windows builds +
# three parallel jobs on every push, which looked like "3 workflows" in the UI.

name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Build channel for artifacts/updater constants'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - main
          - experimental

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore build.py and src/constants.py for CI
        shell: bash
        run: |
          cp .github/ci-blessed/constants.py src/constants.py
          cp .github/ci-blessed/build.py build.py

      - name: Apply update-channel constants for this branch
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_CHANNEL: ${{ github.event.inputs.release_channel || '' }}
          UPDATE_URL_MAIN: ${{ vars.UPDATE_DOWNLOAD_URL_MAIN }}
          UPDATE_URL_EXPERIMENTAL: ${{ vars.UPDATE_DOWNLOAD_URL_EXPERIMENTAL }}
          LICENSE_PUBLIC_KEY_B64: ${{ secrets.LICENSE_PUBLIC_KEY_B64 || secrets.PAID_LICENSE_PUBLIC_KEY_B64 }}
          LICENSE_SIGNIN_URL: ${{ secrets.LICENSE_SIGNIN_URL }}
        run: python tools/ci_apply_build_constants.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib pillow

      - name: Verify Python syntax
        run: |
          python -m py_compile build.py
          python -m py_compile src/constants.py

      - name: Refresh APP_BUILD_TIME_ISO before PyInstaller
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re
          p = Path("src/constants.py")
          text = p.read_text(encoding="utf-8")
          import os
          build_iso = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          commit = os.environ.get("GITHUB_SHA", "").strip()
          text = re.sub(
              r"^APP_BUILD_TIME_ISO\s*=.*$",
              f"APP_BUILD_TIME_ISO = {build_iso!r}",
              text,
              flags=re.M,
          )
          text = re.sub(
              r"^APP_BUILD_COMMIT\s*=.*$",
              f"APP_BUILD_COMMIT = {commit!r}",
              text,
              flags=re.M,
          )
          p.write_text(text, encoding="utf-8")
          print("Refreshed APP_BUILD_TIME_ISO to", build_iso, "commit", commit[:12])
          PY

      - name: Build Windows EXE (PyInstaller via build.py)
        run: python build.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Bundle WinDivert for Clumsy (WinDivert 2.x x64)
        shell: pwsh
        run: |
          & "${{ github.workspace }}/installer/fetch_windivert.ps1"
          & "${{ github.workspace }}/tools/verify_windivert_bundle.ps1"
          & "${{ github.workspace }}/tools/stage_windivert_dist.ps1"

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after Inno install" }
          & $iscc "installer\ZubCut.iss"

      - name: Create channel installer alias
        shell: pwsh
        env:
          REQUESTED_CHANNEL: ${{ github.event.inputs.release_channel || '' }}
        run: |
          $requested = "$env:REQUESTED_CHANNEL".ToLower().Trim()
          if ($requested -eq "main" -or $requested -eq "stable" -or $requested -eq "experimental") {
            if ($requested -eq "experimental") { $channel = "experimental" } else { $channel = "main" }
          } elseif ("${{ github.ref_name }}" -eq "main" -or "${{ github.ref_type }}" -eq "tag") {
            $channel = "main"
          } else {
            $channel = "experimental"
          }
          $latest = Get-ChildItem -Path "output" -Filter "ZubCut-Setup-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $latest) { throw "Installer not found in output/" }
          $aliasName = if ($channel -eq "main") { "ZubCut-Setup.exe" } else { "ZubCut-Setup-experimental.exe" }
          Copy-Item $latest.FullName ("output/" + $aliasName) -Force

      - name: Upload installer EXE
        if: ${{ github.event.inputs.release_channel == 'main' || github.event.inputs.release_channel == 'stable' || (github.event.inputs.release_channel != 'experimental' && (github.ref_name == 'main' || github.ref_type == 'tag')) }}
        uses: actions/upload-artifact@v4
        with:
          name: ZubCut-Windows-Installer
          path: output/ZubCut-Setup.exe

      - name: Upload installer EXE (Experimental)
        if: ${{ github.event.inputs.release_channel == 'experimental' || (github.event.inputs.release_channel != 'main' && github.event.inputs.release_channel != 'stable' && github.ref_name != 'main' && github.ref_type != 'tag') }}
        uses: actions/upload-artifact@v4
        with:
          name: ZubCut-Windows-Installer-Experimental
          path: output/ZubCut-Setup-experimental.exe

  # Apple Silicon (arm64) + Intel (x86_64) — single zip was arm-only and failed on Intel Macs.
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            artifact_name: ZubCut-macOS-arm64
            zip_name: ZubCut-macOS-arm64.zip
          - runner: macos-15-intel
            artifact_name: ZubCut-macOS-Intel
            zip_name: ZubCut-macOS-Intel.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore build.py and src/constants.py for CI
        shell: bash
        run: |
          cp .github/ci-blessed/constants.py src/constants.py
          cp .github/ci-blessed/build.py build.py

      - name: Apply update-channel constants for this branch
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_CHANNEL: ${{ github.event.inputs.release_channel || '' }}
          UPDATE_URL_MAIN: ${{ vars.UPDATE_DOWNLOAD_URL_MAIN }}
          UPDATE_URL_EXPERIMENTAL: ${{ vars.UPDATE_DOWNLOAD_URL_EXPERIMENTAL }}
          LICENSE_PUBLIC_KEY_B64: ${{ secrets.LICENSE_PUBLIC_KEY_B64 || secrets.PAID_LICENSE_PUBLIC_KEY_B64 }}
          LICENSE_SIGNIN_URL: ${{ secrets.LICENSE_SIGNIN_URL }}
        run: python tools/ci_apply_build_constants.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib pillow

      - name: Verify Python syntax
        run: |
          python -m py_compile build.py
          python -m py_compile src/constants.py

      - name: Build macOS app (build.py)
        run: python build.py

      - name: Create ZIP
        run: cd dist && zip -r ../${{ matrix.zip_name }} ZubCut.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.zip_name }}

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore build.py and src/constants.py for CI
        shell: bash
        run: |
          cp .github/ci-blessed/constants.py src/constants.py
          cp .github/ci-blessed/build.py build.py

      - name: Apply update-channel constants for this branch
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_CHANNEL: ${{ github.event.inputs.release_channel || '' }}
          UPDATE_URL_MAIN: ${{ vars.UPDATE_DOWNLOAD_URL_MAIN }}
          UPDATE_URL_EXPERIMENTAL: ${{ vars.UPDATE_DOWNLOAD_URL_EXPERIMENTAL }}
          LICENSE_PUBLIC_KEY_B64: ${{ secrets.LICENSE_PUBLIC_KEY_B64 || secrets.PAID_LICENSE_PUBLIC_KEY_B64 }}
          LICENSE_SIGNIN_URL: ${{ secrets.LICENSE_SIGNIN_URL }}
        run: python tools/ci_apply_build_constants.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib pillow

      - name: Verify Python syntax
        run: |
          python -m py_compile build.py
          python -m py_compile src/constants.py

      - name: Build Linux binary (build.py)
        run: python build.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZubCut-Linux
          path: dist/ZubCut

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ZubCut-Windows-Installer/ZubCut-Setup.exe
            artifacts/ZubCut-macOS-arm64/ZubCut-macOS-arm64.zip
            artifacts/ZubCut-macOS-Intel/ZubCut-macOS-Intel.zip
            artifacts/ZubCut-Linux/ZubCut
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
